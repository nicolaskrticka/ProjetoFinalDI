<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | NetBásico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="login-fundo d-flex align-items-center min-vh-100">
  <main class="container" style="max-width:430px">
    <div class="card p-4 shadow-lg">
      <p class="text-center display-5 mb-0" aria-hidden="true">🌐</p>
      <h1 class="h3 text-center">NetBásico</h1>
      <p class="text-center text-body-secondary">Aprenda redes de computadores do zero</p>
      <form id="formLogin" novalidate>
        <label for="usuario" class="form-label">Usuário</label>
        <input id="usuario" class="form-control mb-3" autocomplete="username">
        <label for="senha" class="form-label">Senha</label>
        <div class="input-group mb-3">
          <input id="senha" type="password" class="form-control" autocomplete="current-password">
          <button type="button" id="ver" class="btn btn-outline-secondary" aria-label="Mostrar ou ocultar senha">Ver</button>
        </div>
        <p id="erro" class="text-danger" role="alert"></p>
        <button class="btn btn-primary w-100 btn-lg">Entrar</button>
      </form>
      <p class="small mt-3 mb-0 text-center">Teste: usuário <b>aluno</b> | senha <b>redes123</b></p>
    </div>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
