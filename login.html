<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Redes v1</title>
  <!-- Bootstrap só como estilizador (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center min-vh-100">
  <main class="container" style="max-width:420px">
    <div class="card p-4 shadow">
      <h1 class="h4 mb-3">Redes de Computadores</h1>
      <form id="formLogin">
        <label for="usuario" class="form-label">Usuário</label>
        <input id="usuario" class="form-control mb-3" required>
        <label for="senha" class="form-label">Senha</label>
        <input id="senha" type="password" class="form-control mb-3" required>
        <p id="erro" class="text-danger" role="alert"></p>
        <button class="btn btn-primary w-100">Entrar</button>
      </form>
      <p class="small mt-3 mb-0">Teste: usuário <b>aluno</b> | senha <b>redes123</b></p>
    </div>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
